<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="P2P file and text sharing directly between browsers. No servers, no uploads." />
    <meta name="theme-color" id="theme-color-meta" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>BeamDrop — P2P File & Text Transfer</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var meta = document.getElementById('theme-color-meta');
          if (saved === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#f8fafc');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            if (meta) meta.setAttribute('content', '#050505');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
